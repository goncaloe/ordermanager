spring:
  application:
    name: ordermanager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ordermanager}
    username: ${DB_USER:ordermanager}
    password: ${DB_PASSWORD:ordermanager}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
